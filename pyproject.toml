[project]
name = "hh-npe"
version = "0.1.0"
description = "Household-level Neural Posterior Estimation for lifecycle preference parameters (Laibson et al. replication)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gyujin Kim" },
]
dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=0.20",
    "numba>=0.59",
    "joblib>=1.3",
    # ML / SBI
    "torch>=2.1",
    "sbi>=0.23,<0.25",
    # Lifecycle solver
    "econ-ark>=0.15",
    # Infra
    "hydra-core>=1.3",
    "wandb>=0.16",
    "pydantic>=2.5",
    # Plotting
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_npe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
