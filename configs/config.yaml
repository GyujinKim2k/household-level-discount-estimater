# Hydra root config — composes simulator + npe + eval defaults.
defaults:
  - simulator: mvp
  - npe: phase3
  - eval: sbc
  - _self_

seed: 0
# ${now:...} re-resolves on every access, so the saved artifacts and
# Hydra's own run directory drifted apart. Use Hydra's resolved dir.
output_dir: ${hydra:runtime.output_dir}

wandb:
  mode: offline   # set to "online" after `wandb login`
  project: hh-npe
  entity: null
